<script>
/* Chrome's "Desktop site" setting (on by default on some Android phones and tablets) lays the page out 980 px wide,
   so everything looks small and leaves empty space. On a phone-sized touch screen, scale it back to the real width. */
(function(){function fit(){var d=document.documentElement;d.style.zoom='';var w=d.clientWidth,s=screen.width;
if(s&&s<820&&matchMedia('(pointer: coarse)').matches&&w>s*1.3){d.style.zoom=(w/s).toFixed(3);d.classList.add('gq-desk');}else d.classList.remove('gq-desk');}
fit();addEventListener('resize',fit);addEventListener('orientationchange',function(){setTimeout(fit,300);});})();
</script>

<script>
/* The phone's own look: iPhone and iPad get Apple's glass bars, Android gets Google's Material bars. Everything else is shared,
   so a class with both kinds of phone sees the same cards, words and buttons. Light or dark follows the phone's setting. */
(function(){var u=navigator.userAgent||'',d=document.documentElement;
d.setAttribute('data-os',/iPhone|iPad|iPod/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)?'ios':/Android/.test(u)?'android':'other');})();
</script>
