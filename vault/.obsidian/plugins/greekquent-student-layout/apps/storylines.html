<meta charset="utf-8">

<title>Greekquent Story Lines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root { --bg: #f6efe2; --ink: #2b2620; --muted: #6d6458; --card: #fffaf1; --line: #e2d6c2; --blue: #1f5fa8; --gold: #d9a43a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans', system-ui, sans-serif; }
.wrap { max-width: 720px; margin: 0 auto; padding: 12px 12px max(16px, env(safe-area-inset-bottom)); }
.brand { margin: 4px 0 10px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.days { display: flex; gap: 4px; flex-wrap: nowrap; margin-bottom: 10px; }
.days button { flex: 1 1 0; min-width: 0; padding: 0 2px; min-height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); font: inherit; font-weight: 600; font-size: 14px; color: var(--ink); cursor: pointer; }
.days button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.stage-wrap { position: relative; border-radius: 16px; overflow: hidden; background: #fff; border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(60,40,20,.12); }
#stage { display: block; width: 100%; height: auto; }
.subs { background: #1e1b18; color: #fff; padding: 12px 14px 14px; min-height: 104px; }
.who { font-size: 13px; font-weight: 700; letter-spacing: .04em; min-height: 18px; }
.gr { font-family: 'Comfortaa', 'Noto Sans', sans-serif; font-size: clamp(20px, 5.4vw, 28px); font-weight: 700; line-height: 1.35; margin-top: 2px; }
.gr span { opacity: .5; transition: opacity .18s, color .18s; }
.gr span.on { opacity: 1; }
.gr span.key { color: #ffd27a; }
.en { color: #cfc6b8; font-size: 15px; margin-top: 4px; min-height: 20px; }
.en[hidden] { display: none; }
.bigplay { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); width: 76px; height: 76px; border-radius: 50%; border: 0; background: rgba(31,95,168,.92); color: #fff; font-size: 30px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.bigplay[hidden] { display: none; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.controls button { min-height: 44px; padding: 0 16px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; }
.primary { background: var(--blue); color: #fff; border: 0; }
.ghost { background: var(--card); color: var(--blue); border: 2px solid var(--line); }
.ghost[aria-pressed=true] { background: #e3ecf7; border-color: var(--blue); }
.hint { color: var(--muted); font-size: 14px; }
/* scene animation */
#stage * { transition: transform .5s cubic-bezier(.3,1.4,.5,1), opacity .35s; transform-box: fill-box; transform-origin: center; }
.char.talk .mouth { animation: talk .22s infinite alternate; }
@keyframes talk { from { transform: scaleY(.3); } to { transform: scaleY(1.3); } }
.char.glow .halo { opacity: 1; }
.halo { opacity: 0; }
.char.shake { animation: shake .4s 2; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.char.hop { animation: hop .35s 2; }
@keyframes hop { 50% { transform: translateY(-8px); } }
.pop { opacity: 0; transform: scale(.2); }
.pop.in { opacity: 1; transform: scale(1); }
.q { opacity: 0; }
.q.in { opacity: 1; animation: bob 1s infinite alternate; }
@keyframes bob { to { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { #stage *, .char.talk .mouth, .char.shake, .char.hop, .q.in { animation: none !important; transition: opacity .2s !important; } }
.modes { display: flex; gap: 6px; margin-bottom: 10px; }
.modes button { flex: 1; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; }
.modes button.on { background: #1e1b18; color: #9dff9d; border-color: #1e1b18; }
[hidden] { display: none !important; }
.crt { position: relative; background: #0b100b; border-radius: 16px; padding: 14px 14px 12px; min-height: 420px; font-family: 'Noto Sans Mono', ui-monospace, monospace; color: #8dff8d; text-shadow: 0 0 6px rgba(120,255,120,.55); box-shadow: inset 0 0 60px rgba(0,0,0,.8), 0 8px 24px rgba(0,0,0,.25); overflow: hidden; }
.crt::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
.out { font-size: 15px; line-height: 1.5; white-space: pre-wrap; max-height: 52vh; min-height: 300px; overflow-y: auto; }
.out .gr { font-family: inherit; font-size: 18px; color: #ffd27a; text-shadow: 0 0 6px rgba(255,200,90,.5); font-weight: 700; display: block; margin: 4px 0; }
.out .you { color: #c8ffc8; opacity: .8; }
.out .bad { color: #ff9a8a; text-shadow: none; }
.out .title { color: #fff; font-weight: 700; }
#form { display: flex; align-items: center; gap: 8px; margin-top: 10px; border-top: 1px solid #1f3a1f; padding-top: 10px; }
.pr { font-weight: 700; }
#cmd { flex: 1; min-height: 44px; background: transparent; border: 0; outline: 0; color: #c8ffc8; font: 700 20px 'Noto Sans Mono', monospace; caret-color: #8dff8d; text-shadow: inherit; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chips button { min-height: 44px; padding: 0 14px; border-radius: 4px; border: 1px solid #3a7a3a; background: #0f1f0f; color: #8dff8d; font: 700 17px 'Noto Sans Mono', monospace; cursor: pointer; }
.wk { width: 100%; min-height: 44px; margin-bottom: 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 600; padding: 0 10px; }
#stage .card { opacity: 0; transform: scale(.3); transition: opacity .3s, transform .45s cubic-bezier(.3,1.5,.5,1); transform-box: fill-box; transform-origin: center; }
#stage .card.in { opacity: 1; transform: scale(1); }
.days button small { display: block; font-size: 11px; font-weight: 600; opacity: .75; line-height: 1.1; }
.days button { line-height: 1.15; min-height: 44px; }

</style>

<main class="wrap">
  <header class="top">
    <p class="brand" id="brand">Greekquent</p>
    <select id="wk" class="wk" aria-label="Week"></select>
    <nav class="days" id="days" aria-label="Days"></nav>
    <div class="modes" role="tablist">

    </div>
  </header>
  <div id="watch">
  <section class="stage-wrap">
    <svg id="stage" viewBox="0 0 400 260" role="img" aria-label="Story scene"></svg>
    <div class="subs" id="subs" aria-live="polite">
      <div class="who" id="who"></div>
      <div class="gr" id="gr" lang="el"></div>
      <div class="en" id="en"></div>
    </div>
    <button class="bigplay" id="bigplay" aria-label="Play">▶</button>
  </section>
  <div class="controls">
    <button id="play" class="primary">Play</button>
    <button id="slow" class="ghost" aria-pressed="false">Slower</button>
    <button id="enbtn" class="ghost" aria-pressed="false">English</button>
    <button id="week" class="ghost">Whole week</button>
  </div>
  <p class="hint" id="hint"></p>
  </div>
  <section id="adv" class="adv" hidden>
    <div class="crt" id="crt"><div class="out" id="out" aria-live="polite"></div>
      <form id="form" autocomplete="off"><span class="pr">&gt;</span><input id="cmd" lang="el" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type a Greek word"></form>
      <div class="chips" id="chips"></div>
    </div>
    <p class="hint">Type the magic word in Greek. No Greek keyboard? Greeklish works too (nero = νερό). Type HELP for a clue, LOOK to see the scene again.</p>
  </section>
</main>

    line.ids.slice(0, 4).forEach((id, i) => {
      const lk = LOOK[id] || ['#3a3330', XCOL[hash(id) % XCOL.length], ['#f2c9a5', '#e8b98f', '#c99a72'][hash(id) % 3], hash(id) % 2 === 0];
      chars += `<g transform="translate(${xs[i]},182)">${person(cid(id), ...lk)}</g>`;
      if (id.startsWith('x:')) chars += `<text x="${xs[i]}" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620" opacity=".75">${id.slice(2)}</text>`;
    });
    $('stage').innerHTML = SC.BG[line.bg]() + chars + '<g id="cards"></g>';
  }
  let cardN = 0;
  function popCard(k) {
    // Card text: nouns keep their article (η εκκλησία) so the gender shows. Words that change to agree
    // (ο/η/το, ένας/μία/ένα, μεγάλος/μεγάλη/μεγάλο) show the form actually said in the line, never just the first one.
    const changes = /,/.test(k.l) || (/(ος|ός|ής)$/.test(k.l) && !/^(ο|η|το|οι|τα) /.test(k.l));
    const gr = changes ? k.f.toLowerCase() : k.l.split(',')[0];
    const g = el('cards'); if (!g || g.querySelector(`[data-l="${CSS.escape(gr)}"]`)) return;
    const i = cardN++, x = 8 + (i % 4) * 97, y = 8 + Math.floor(i / 4) * 44;
    const o = document.createElementNS(NS, 'g'); o.setAttribute('data-l', gr); o.setAttribute('transform', `translate(${x},${y})`);
    const c = document.createElementNS(NS, 'g'); c.setAttribute('class', 'card'); o.appendChild(c);
    c.innerHTML = `<rect width="92" height="38" rx="8" fill="#fffaf1" stroke="#d9a43a" stroke-width="2"/><text x="46" y="17" text-anchor="middle" font-family="Comfortaa, sans-serif" font-size="${gr.length > 14 ? 9 : gr.length > 10 ? 10 : 13}" font-weight="700" fill="#1e1b18">${gr}</text><text x="46" y="31" text-anchor="middle" font-size="9" fill="#6d6458">${(k.e || '').slice(0, 18)}</text>`;
    g.appendChild(o); requestAnimationFrame(() => c.classList.add('in'));
  }
  function resetGen(line) { buildGen(line); cardN = 0; }

  // ---------- subtitles + speech ----------
  const norm = (w) => w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[.,;!?;·«»()…:—–-]/g, '');
  // Speech engines read a capital Η or Ο on its own as a letter name ("ita", "omikron"). Articles get lowercased just for the voice.
  const fixTTS = (t) => t.replace(/(^|[^\p{L}])([ΗΟ])(?=[^\p{L}]|$)/gu, (m, a, b) => a + b.toLowerCase());
  window.GQ_fixTTS = fixTTS;
  let voice = null;
  function pickVoice() { const vs = window.speechSynthesis ? speechSynthesis.getVoices() : []; voice = vs.find((v) => /^el/i.test(v.lang)) || null; }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  let run = 0, slow = false, showEn = false, cur = 1, curWeek = 1;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const who = (ch) => ch.name || (PEOPLE[ch.who] || {}).name || '';
  const charEl = (line, ch) => line.gen ? el(cid(ch.who)) : el(ch.who);

  function subtitle(line, ch) {
    const p = PEOPLE[ch.who] || { color: XCOL[hash(ch.who) % XCOL.length] };
    $('who').textContent = who(ch); $('who').style.color = p.color === undefined ? '#fff' : (ch.who.startsWith('x:') ? '#f7c08a' : p.color);
    const keys = new Set(line.keys.flatMap((k) => k.split(' ')).map(norm));
    const words = ch.gr.split(' ');
    $('gr').innerHTML = '';
    const spans = words.map((w) => { const s = document.createElement('span'); s.textContent = w + ' '; if (keys.has(norm(w))) s.className = 'key'; $('gr').appendChild(s); return s; });
    $('en').textContent = ch.en; $('en').hidden = !showEn;
    return { words, spans };
  }

  function say(line, ch, my) {
    return new Promise((resolve) => {
      const { words, spans } = subtitle(line, ch);
      const cues = {}; Object.keys(ch.cues || {}).forEach((k) => { cues[norm(k)] = ch.cues[k]; });
      if (ch.k) ch.k.forEach((k) => { const first = norm(k.f.split(' ')[0]); const prev = cues[first]; cues[first] = () => { if (prev) prev(); popCard(k); const c = charEl(line, ch); if (c) S_once(c, 'hop'); }; });
      const starts = []; let pos = 0; words.forEach((w) => { starts.push(pos); pos += w.length + 1; });
      const fired = new Set();
      const light = (i) => { for (let j = 0; j <= i && j < spans.length; j++) { if (fired.has(j)) continue; fired.add(j); spans[j].classList.add('on'); const f = cues[norm(words[j])]; if (f) f(); } };
      const rate = slow ? 0.62 : 0.9;
      const est = Math.max(700, (ch.gr.length * 78) / rate);
      const timers = []; let byBoundary = false, done = false;
      const ce = charEl(line, ch);
      const finish = () => { if (done) return; done = true; timers.forEach(clearTimeout); light(words.length - 1); if (ce) ce.classList.remove('talk'); resolve(); };
      if (ce) { ce.classList.add('talk'); if (line.gen) document.querySelectorAll('#stage .char').forEach((c) => c.classList.toggle('glow', c === ce)); }
      starts.forEach((c, i) => timers.push(setTimeout(() => { if (!byBoundary && my === run) light(i); }, (c / ch.gr.length) * est)));
      if (voice && window.speechSynthesis) {
        const u = new SpeechSynthesisUtterance(fixTTS(ch.gr));
        u.voice = voice; u.lang = voice.lang; u.rate = rate; u.pitch = (PEOPLE[ch.who] || { pitch: 0.9 + (hash(ch.who) % 5) / 10 }).pitch;
        u.onboundary = (e) => { if (e.name && e.name !== 'word') return; byBoundary = true; let i = 0; while (i + 1 < starts.length && starts[i + 1] <= e.charIndex) i++; light(i); };
        u.onend = () => setTimeout(finish, 150); u.onerror = finish;
        window._u = u; speechSynthesis.speak(u);
        timers.push(setTimeout(finish, est * 2.5 + 2000));
      } else timers.push(setTimeout(finish, est + 300));
    });
  }
  const S_once = (e, cls) => { e.classList.remove(cls); void e.getBBox(); e.classList.add(cls); };

  const getLine = (n) => (n <= 6 ? LINES[n - 1] : genLine(n));
  function prep(line) { if (line.gen) resetGen(line); else { if (!$('board')) build(); reset(line.base); } }

  async function playLine(n, my) {
    const line = getLine(n); cur = n; markDay();
    prep(line);
    await wait(350);
    for (const ch of line.chunks) {
      if (my !== run) return false;
      if (ch.start) ch.start();
      await say(line, ch, my);
      if (my !== run) return false;
      if (ch.end) ch.end();
      await wait(slow ? 700 : 450);
    }
    return true;
  }

  function stop() { run++; if (window.speechSynthesis) speechSynthesis.cancel(); document.querySelectorAll('#stage .char').forEach((c) => c.classList.remove('talk')); }

  async function play(n) {
    stop(); const my = run;
    $('bigplay').hidden = true; $('hint').textContent = 'Listen and watch.';
    const ok = await playLine(n, my);
    if (ok && my === run) { $('hint').textContent = 'Your turn: say the lines out loud. Tap Play to hear them again.'; $('bigplay').textContent = '↻'; $('bigplay').hidden = false; }
  }
  async function playWeek() {
    const days = weekOf(cur).days;
    stop(); const my = run; $('bigplay').hidden = true; $('hint').textContent = 'The whole week, Monday to Saturday.';
    for (const n of days) { if (!(await playLine(n, my))) return; await wait(900); }
    if (my === run) { $('hint').textContent = 'Sunday: tell the whole story in your own words.'; $('bigplay').textContent = '↻'; $('bigplay').hidden = false; }
  }
  function show(n) {
    if (!getLine(n)) n = 1;
    const w = weekOf(n); if (w.n !== curWeek || !$('days').children.length) setWeek(w.n, true);
    stop(); cur = n; markDay(); const line = getLine(n); prep(line);
    const first = line.chunks[0]; subtitle(line, first).spans.forEach((sp) => sp.classList.add('on'));
    $('bigplay').textContent = '▶'; $('bigplay').hidden = false;
    $('hint').textContent = "Watch, then say the lines with the characters. Gold words are today's words.";
    window.GQDay = n; if (window.onGQDay) window.onGQDay(n);
  }
  function markDay() { [...$('days').children].forEach((b) => b.classList.toggle('on', +b.dataset.n === cur)); }
  function setWeek(wn, quiet) {
    const w = STORY.weeks.find((x) => x.n === wn); curWeek = wn; $('wk').value = wn;
    $('brand').textContent = `Greekquent · Week ${w.n} · ${w.title}`;
    $('days').innerHTML = '';
    w.days.forEach((n) => { const b = document.createElement('button'); b.dataset.n = n; b.innerHTML = `<small>${label(n)}</small>${n}`; b.setAttribute('aria-label', `${label(n)}, day ${n}`); b.onclick = () => show(n); $('days').appendChild(b); });
    if (!quiet) show(w.days[0]);
  }

  // ---------- wire up ----------
  STORY.weeks.filter((w) => w.days.length).forEach((w) => { const o = document.createElement('option'); o.value = w.n; o.textContent = `Week ${w.n} · ${w.title}`; $('wk').appendChild(o); });
  $('wk').onchange = () => setWeek(+$('wk').value);
  $('play').onclick = () => play(cur);
  $('bigplay').onclick = () => play(cur);
  $('week').onclick = playWeek;
  $('slow').onclick = () => { slow = !slow; $('slow').setAttribute('aria-pressed', slow); };
  $('enbtn').onclick = () => { showEn = !showEn; $('enbtn').setAttribute('aria-pressed', showEn); $('en').hidden = !showEn; };
  window.GQStop = stop;
  window.GQ_getLine = getLine; window.GQ_weekOf = weekOf;
  const start = window.GQ_START || {}; const m = (window.GQ_HASH || location.hash).match(/d=(\d+)/);
  show(+(start.d || (m && m[1]) || 1));
  window.addEventListener('hashchange', () => { const h = (window.GQ_HASH || location.hash).match(/d=(\d+)/); if (h) show(+h[1]); });
})();

</script>
<script>
// Retro text adventure: each day's scene only moves on when the player types the right Greek word.
(function () {
  const $ = (id) => document.getElementById(id);
  // Each step: what you see, the clue (HELP), accepted answers, what happens next.
  const DAYS = [
    { title: 'DAY 1 · THE CLASSROOM', look: 'A classroom. Chalk dust. A boy at the next desk turns around and points at you.', steps: [
      { see: 'He points at you. Point back at him and say "you".', help: 'you (one person) = εσύ', ans: ['εσύ'], ok: 'He grins and points at himself.' },
      { see: 'Now point at yourself. Say "I".', help: 'I = εγώ', ans: ['εγώ'], ok: 'You both laugh.' },
      { see: 'The teacher writes ΜΑΘΗΜΑ 1 on the board.\nFinish the line: Εσύ κι εγώ είμαστε ___ ένα μάθημα. (in)', help: 'in, at, to = σε', ans: ['σε'], ok: 'line' } ],
      line: 'Εσύ κι εγώ είμαστε σε ένα μάθημα.' },
    { title: 'DAY 2 · SOMETHING BEHIND HIS BACK', look: 'The boy is hiding something behind his back. He is smiling too much.', steps: [
      { see: 'Ask him: "What?" (What do you have?)', help: 'what = τι', ans: ['τι'], ok: 'He says: Έχω το κινητό σου.' },
      { see: 'Έχω το κινητό ___. Whose phone is it? (yours)', help: 'your = σου', ans: ['σου'], ok: 'It is YOUR phone.' },
      { see: 'Say "No!"', help: 'no = όχι', ans: ['όχι'], ok: 'He nods slowly.' },
      { see: 'What does his nod mean? Say "yes".', help: 'yes = ναι', ans: ['ναι'], ok: 'line' } ],
      line: 'Τι έχεις; — Έχω το κινητό σου. — Όχι! — Ναι!' },
    { title: 'DAY 3 · THE TEACHER', look: 'The teacher stops at your desk. She asks something fast: Πώς σας λένε;', steps: [
      { see: 'Too fast. Politely ask her to repeat: "Please?"', help: 'please = παρακαλώ', ans: ['παρακαλώ'], ok: 'She smiles and says it slowly: Πώς σας λένε;' },
      { see: 'She wants your name. Type it.', help: 'Any name works. Try Μαρία.', any: true, ok: 'She writes it on the board.' },
      { see: 'Say "thank you".', help: 'thank you = ευχαριστώ', ans: ['ευχαριστώ'], ok: 'line' } ],
      line: 'Πώς σας λένε, παρακαλώ; — Μαρία. — Ευχαριστώ.' },
    { title: 'DAY 4 · THE ERRAND', look: 'The teacher needs three things from your desk: water, a book and a key.', steps: [
      { see: 'Greet her first.', help: 'hi = γεια', ans: ['γεια'], ok: 'She waves.' },
      { see: 'Hand them over: "Here you are."', help: 'here you are = ορίστε', ans: ['ορίστε'], ok: 'She takes the water and the book.' },
      { see: 'One thing is still in your hand. The ___ (key)', help: 'key = κλειδί', ans: ['κλειδί', 'το κλειδί'], ok: 'line' } ],
      line: 'Γεια! Ορίστε το νερό, το βιβλίο και το κλειδί.' },
    { title: 'DAY 5 · THE BAG', look: 'After class. Your bag sits on the desk. Something is missing.', steps: [
      { see: 'Open the bag.', help: 'bag = τσάντα', ans: ['τσάντα', 'η τσάντα'], ok: 'Inside: something yellow, with pages.' },
      { see: 'What is it?', help: 'notebook = τετράδιο', ans: ['τετράδιο', 'το τετράδιο'], ok: 'And something blue and thin.' },
      { see: 'What is it?', help: 'pen = στυλό', ans: ['στυλό', 'το στυλό'], ok: 'But something is NOT there.' },
      { see: 'What is missing?', help: 'phone = κινητό', ans: ['κινητό', 'το κινητό'], ok: 'Your heart sinks. Τι ___; (What do I do?)' },
      { see: 'Τι ___; (do)', help: 'I do = κάνω', ans: ['κάνω'], ok: 'line' } ],
      line: 'Στην τσάντα έχω τετράδιο και στυλό. Το κινητό; Τι κάνω;' },
    { title: 'DAY 6 · THE GREEN BAG', look: 'The boy is packing up. His green bag is open.', steps: [
      { see: 'Say what you want: "I want my phone."', help: 'I want = θέλω', ans: ['θέλω'], ok: 'You look around the room.' },
      { see: 'Something black in his green bag. Say "I see".', help: 'I see = βλέπω', ans: ['βλέπω'], ok: 'Νομίζω ότι το βλέπω. (I think I see it.)' },
      { see: 'Ask him: "May I?"', help: 'I can, may I = μπορώ', ans: ['μπορώ'], ok: 'line' } ],
      line: 'Θέλω το κινητό μου. Νομίζω ότι το βλέπω. Μπορώ;', cliff: 'He zips the bag shut. TO BE CONTINUED ON MONDAY.' },
  ];

  // Days 7 to 300 are generated from the story data: each gold word becomes a magic word.
  const ALL = [1, 2, 3, 4, 5, 6, ...Object.keys(window.GQ_STORY.days).map(Number).sort((a, b) => a - b)];
  const NAMES = { maria: 'MARIA', nikos: 'NIKOS', teacher: 'MRS ELENI', giagia: 'GRANDMA', pappous: 'GRANDPA', nonos: 'THE GODFATHER', mom: 'MOM', eleni: 'AUNT ELENI' };
  const GRN = { maria: 'Μαρία', nikos: 'Νίκος', teacher: 'Κυρία Ελένη', giagia: 'Γιαγιά', pappous: 'Παππούς', nonos: 'Νονός', mom: 'Η μαμά', eleni: 'Ελένη' };
  const esc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function genDay(n) {
    const d = window.GQ_STORY.days[n]; if (!d) return null;
    const S = window.GQ_SCENES, wk = window.GQ_weekOf(n), last = wk.days[wk.days.length - 1] === n;
    const nm = (l) => l.n || GRN[l.w] || '';
    const people = [...new Set(d.lines.map((l) => (l.n ? l.n : NAMES[l.w])))].join(', ');
    const pi = ALL.indexOf(n), prev = pi > 0 ? window.GQ_STORY.days[ALL[pi - 1]] : null;
    let look = S.DESC[d.bg] + '\nWITH YOU: ' + people + '.';
    if (prev) look += '\nLAST TIME: ' + prev.lines.map((l) => l.e).join(' ');
    const steps = []; let pre = [];
    d.lines.forEach((l) => {
      if (!l.k.length) { pre.push(nm(l) + ': ' + l.g); return; }
      l.k.forEach((k, j) => {
        const blank = l.g.replace(new RegExp(esc(k.f)), '___');
        const lem = k.l.replace(/^(ο|η|το|οι|τα) /, '');
        steps.push({ pre: pre.join('\n'), see: nm(l) + ': ' + blank + '\n(' + k.e + ')', help: k.e + ' = ' + k.l + (k.f.toLowerCase() !== lem.toLowerCase() ? '  ·  here: ' + k.f : ''),
          // Words that change with gender (το, μία, μεγάλη) only open the scene in the form the line needs.
          alt: [k.l, lem, ...lem.split(',').map((x) => x.trim())],
          ans: (/,/.test(k.l) || (/(ος|ός|ής)$/.test(k.l) && !/^(ο|η|το|οι|τα) /.test(k.l))) ? [k.f] : [k.f, k.l, lem, ...lem.split(',').map((x) => x.trim())], ok: j === l.k.length - 1 ? nm(l) + ': ' + l.g : 'Yes. Keep going.' });
        pre = [];
      });
    });
    if (steps.length) steps[steps.length - 1].ok = 'line';
    return { title: 'DAY ' + n + ' · ' + S.PLACE[d.bg], look, steps, line: d.lines.map((l) => nm(l) + ': ' + l.g).join('\n'), tail: pre.join('\n'),
      cliff: n === 300 ? 'THE END. Θα τα πούμε.' : last ? 'TO BE CONTINUED NEXT WEEK.' : '' };
  }
  const getDay = (n) => (n <= 6 ? DAYS[n - 1] : genDay(n));
  const nextOf = (n) => ALL[(ALL.indexOf(n) + 1) % ALL.length];

  // Accept Greek with or without accents, and Greeklish.
  const deacc = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[.,;!?;·]/g, '').trim();
  const G2L = { α: 'a', β: 'v', γ: 'g', δ: 'd', ε: 'e', ζ: 'z', η: 'i', θ: 'th', ι: 'i', κ: 'k', λ: 'l', μ: 'm', ν: 'n', ξ: 'ks', ο: 'o', π: 'p', ρ: 'r', σ: 's', ς: 's', τ: 't', υ: 'i', φ: 'f', χ: 'h', ψ: 'ps', ω: 'o' };
  const loose = (s) => {
    let t = [...deacc(s)].map((c) => G2L[c] ?? c).join('');
    t = t.replace(/ch/g, 'h').replace(/x/g, 'ks').replace(/y/g, 'i').replace(/w/g, 'o').replace(/u/g, 'i').replace(/b/g, 'v').replace(/(.)\1/g, '$1');
    t = t.replace(/ei|oi/g, 'i').replace(/ai/g, 'e').replace(/(.)\1/g, '$1').replace(/^gi/, 'i');
    return t;
  };
  const near = (a, b) => { // one typo allowed in longer words
    if (Math.abs(a.length - b.length) > 1 || a.length < 5) return false;
    let i = 0, j = 0, e = 0;
    while (i < a.length && j < b.length) { if (a[i] === b[j]) { i++; j++; continue; } if (++e > 1) return false; if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; } }
    return e + (a.length - i) + (b.length - j) <= 1;
  };
  const match = (input, ans) => ans.some((a) => deacc(a) === deacc(input) || loose(a) === loose(input) || near(loose(a), loose(input)));

  let day = 1, step = 0, misses = 0, busy = false;
  const out = $('out');
  function add(text, cls) { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text; out.appendChild(d); out.scrollTop = out.scrollHeight; return d; }
  async function type(text, cls) {
    const d = add('', cls); busy = true;
    for (let i = 0; i < text.length; i++) { d.textContent += text[i]; if (i % 2 === 0) await new Promise((r) => setTimeout(r, 14)); out.scrollTop = out.scrollHeight; }
    busy = false;
  }
  function speak(t) {
    if (!window.speechSynthesis) return; const v = speechSynthesis.getVoices().find((x) => /^el/i.test(x.lang)); if (!v) return;
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(window.GQ_fixTTS ? window.GQ_fixTTS(t.replace(/^[^:\n]{1,20}: /gm, '')) : t); u.voice = v; u.lang = v.lang; u.rate = 0.85; window._au = u; speechSynthesis.speak(u);
  }
  function chips() {
    const box = $('chips'); box.innerHTML = '';
    const s = getDay(day).steps[step]; if (!s || s.any || misses < 2) return;
    const pool = getDay(day).steps.filter((x) => !x.any).map((x) => x.ans[0]);
    const opts = [...new Set([s.ans[0], ...pool.filter((w) => w !== s.ans[0])])].slice(0, 3).sort(() => Math.random() - 0.5);
    opts.forEach((w) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = w; b.onclick = () => submit(w); box.appendChild(b); });
  }
  async function ask() { const s = getDay(day).steps[step]; if (s.pre) { const g = add(s.pre, 'gr'); g.lang = 'el'; } await type(s.see); chips(); $('cmd').focus({ preventScroll: true }); }
  async function start(i) {
    day = i; step = 0; misses = 0; out.innerHTML = ''; $('chips').innerHTML = '';
    await type(getDay(day).title, 'title'); await type(getDay(day).look); await ask();
  }
  async function submit(raw) {
    const v = raw.trim(); if (!v || busy) return; $('cmd').value = '';
    add('> ' + v, 'you');
    const cmd = deacc(v);
    const d = getDay(day);
    if (step >= d.steps.length) { start(nextOf(day)); return; }
    if (['help', 'hint', 'βοηθεια'].includes(cmd)) { await type('CLUE: ' + d.steps[step].help); return; }
    if (['look', 'l', 'κοιτα'].includes(cmd)) { await type(d.look); await type(d.steps[step].see); return; }
    const s = d.steps[step];
    if (s.any || match(v, s.ans)) {
      if (!s.any) speak(s.ans[0]);
      misses = 0; $('chips').innerHTML = ''; step++;
      if (s.ok === 'line') {
        await type('* The scene clicks into place. *');
        if (d.tail) { const t = add(d.tail, 'gr'); t.lang = 'el'; }
        const g = add(d.line, 'gr'); g.lang = 'el'; speak(d.line + (d.tail ? '\n' + d.tail : ''));
        if (d.cliff) await type(d.cliff);
        await type(day === 300 ? 'Press ENTER to start the year again.' : 'Press ENTER for day ' + nextOf(day) + '.');
        $('form').dataset.next = '1';
      } else { await type(s.ok); await ask(); }
    } else {
      misses++;
      // Right word, wrong gender: say so, so the gender is the lesson, not a mystery.
      const near = s.alt && match(v, s.alt);
      const msg = near ? 'Almost. Right word, but it has to agree with the noun. Try another form.' : misses === 1 ? 'Nothing happens. The word has no power here.' : 'Still nothing. Type HELP, or pick a word below.';
      add(msg, 'bad'); chips();
    }
  }
  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('cmd').value;
    if (!v.trim() && getDay(day) && step >= getDay(day).steps.length && !busy) { start(nextOf(day)); return; }
    submit(v);
  });
  $('crt').addEventListener('click', (e) => { if (e.target.tagName !== 'BUTTON') $('cmd').focus({ preventScroll: true }); });

  // Mode switch shared with the Watch view.
  let mode = 'watch', shownDay = window.GQDay || 1;
  window.onGQDay = (i) => { shownDay = i; if (mode === 'play') start(i); };
  function setMode(m) {
    mode = m; $('m-watch').classList.toggle('on', m === 'watch'); $('m-play').classList.toggle('on', m === 'play');
    $('watch').hidden = m !== 'watch'; $('adv').hidden = m !== 'play';
    if (window.GQStop) window.GQStop();
    if (m === 'play') start(shownDay);
  }
  $('m-watch').onclick = () => setMode('watch');
  $('m-play').onclick = () => setMode('play');
  if (/play/.test((window.GQ_HASH || location.hash)) || (window.GQ_START && window.GQ_START.play)) setMode('play');
})();

</script>
